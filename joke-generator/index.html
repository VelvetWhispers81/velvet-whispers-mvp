<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>😂 Random Joke Generator</h1>
            <p class="subtitle">Get a laugh with random jokes!</p>
        </header>

        <div class="joke-display">
            <div id="jokeContainer" class="joke-container">
                <p class="loading">Click "Get Joke" to start laughing! 🎉</p>
            </div>
        </div>

        <div class="button-group">
            <button id="getJokeBtn" class="btn btn-primary">Get Joke</button>
            <button id="copyBtn" class="btn btn-secondary" disabled>Copy Joke</button>
        </div>

        <div class="filter-section">
            <label for="jokeType">Joke Type:</label>
            <select id="jokeType" class="select-dropdown">
                <option value="any">Any</option>
                <option value="single">Single</option>
                <option value="twopart">Two Part</option>
            </select>
        </div>

        <div class="category-section">
            <label>Categories:</label>
            <div class="category-buttons">
                <button class="category-btn active" data-category="any">All</button>
                <button class="category-btn" data-category="general">General</button>
                <button class="category-btn" data-category="programming">Programming</button>
                <button class="category-btn" data-category="knock-knock">Knock-Knock</button>
            </div>
        </div>

        <div class="favorites-section">
            <h3>Favorite Jokes ⭐</h3>
            <div id="favoritesList" class="favorites-list">
                <p class="empty-favorites">No favorite jokes yet!</p>
            </div>
            <button id="clearFavoritesBtn" class="btn btn-danger" style="display: none;">Clear Favorites</button>
        </div>

        <div class="stats-section">
            <p class="stats">Jokes fetched: <span id="jokeCount">0</span></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
